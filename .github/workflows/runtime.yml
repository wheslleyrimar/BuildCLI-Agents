name: runtime

on:
  push:
    paths: ["buildcli/**", ".github/workflows/runtime.yml"]
  pull_request:
    paths: ["buildcli/**", ".github/workflows/runtime.yml"]
  # Path filters mean a push can legitimately produce no run — including the
  # push that creates the repository. Keep a manual trigger so the suite can
  # always be exercised on demand.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The runtime ships to whatever python3 the target machine has.
        python: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        working-directory: buildcli/runtime
        run: python3 -m unittest discover -s tests -q

      - name: Stdlib only — no third-party imports
        working-directory: buildcli/runtime
        run: |
          if grep -rnE '^\s*(import|from)\s+(?!(os|sys|re|json|argparse|subprocess|shlex|datetime|tempfile|shutil|unittest|glob)\b)' \
               --include='*.py' -P . ; then
            echo "third-party import found — the runtime must stay stdlib only" >&2
            exit 1
          fi
          echo "stdlib only: confirmed"

  skills-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Claude pipeline skills are generated from their command files.
      # This is the check that would have caught `.prism/` surviving a rename.
      - name: Skills match their commands
        run: python3 buildcli/scripts/generate-skills.py --check

  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap into a scratch project
        run: |
          mkdir -p /tmp/target
          printf '# Notes\n\nhand written\n' > /tmp/target/CLAUDE.md
          bash buildcli/scripts/bootstrap.sh --repo /tmp/target --agent all --mode copy

      - name: Idempotent — markers stay at one pair, hand-written text survives
        run: |
          bash buildcli/scripts/bootstrap.sh --repo /tmp/target --agent all --mode copy
          bash buildcli/scripts/bootstrap.sh --repo /tmp/target --agent all --mode copy
          for f in CLAUDE.md AGENTS.md GEMINI.md .github/copilot-instructions.md; do
            s=$(grep -c 'buildcli:autoload:start' "/tmp/target/$f")
            e=$(grep -c 'buildcli:autoload:end'   "/tmp/target/$f")
            [ "$s" = "1" ] && [ "$e" = "1" ] || { echo "$f: $s start / $e end markers" >&2; exit 1; }
          done
          grep -q 'hand written' /tmp/target/CLAUDE.md || { echo "hand-written text lost" >&2; exit 1; }
          echo "idempotent: confirmed"

      - name: Runtime is installed and runs
        run: /tmp/target/.buildcli/runtime/bcx --version

      # The summary line is the only thing most people read, so its count has to
      # be true. A file installed without a tick() call would drift silently.
      - name: Reported file count matches the disk
        run: |
          rm -rf /tmp/counted && mkdir -p /tmp/counted
          reported=$(bash buildcli/scripts/bootstrap.sh --repo /tmp/counted \
                       | sed -n 's/^Done\. \([0-9]*\) files.*/\1/p')
          actual=$(find /tmp/counted -type f | wc -l | tr -d ' ')
          [ "$reported" = "$actual" ] || {
            echo "bootstrap reported $reported files, $actual on disk" >&2; exit 1; }
          echo "count: $reported, confirmed"

      - name: Guard rejects --repo inside the kit
        run: |
          if bash buildcli/scripts/bootstrap.sh --repo buildcli/claude 2>/dev/null; then
            echo "guard did not fire" >&2; exit 1
          fi
          echo "guard: confirmed"
